name: Android Build

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: 37.0.0
          cmdline-tools-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tuneplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  prerelease:
    name: Build Pre-Release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: 37.0.0
          cmdline-tools: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # Decodes the release keystore only when the secret is configured. With no
      # secret the build stays unsigned instead of failing, so forks still get
      # an installable pre-release artifact.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNEPLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "keystore decoded"
          else
            echo "no keystore secret; building unsigned"
          fi

      - name: Build pre-release APK
        env:
          TUNEPLAYER_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          TUNEPLAYER_STORE_PASSWORD: ${{ secrets.TUNEPLAYER_STORE_PASSWORD }}
          TUNEPLAYER_KEY_ALIAS: ${{ secrets.TUNEPLAYER_KEY_ALIAS }}
          TUNEPLAYER_KEY_PASSWORD: ${{ secrets.TUNEPLAYER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload pre-release APK
        uses: actions/upload-artifact@v4
        with:
          name: tuneplayer-prerelease
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Build Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: 37.0.0
          cmdline-tools-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TUNEPLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            echo "keystore decoded"
          else
            echo "no keystore secret; building unsigned release APK"
          fi

      - name: Build release
        env:
          TUNEPLAYER_STORE_FILE: ${{ github.workspace }}/keystore/release.keystore
          TUNEPLAYER_STORE_PASSWORD: ${{ secrets.TUNEPLAYER_STORE_PASSWORD }}
          TUNEPLAYER_KEY_ALIAS: ${{ secrets.TUNEPLAYER_KEY_ALIAS }}
          TUNEPLAYER_KEY_PASSWORD: ${{ secrets.TUNEPLAYER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: TunePlayer ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/**/*.apk

name: Android Build

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: 37.0.0
          cmdline-tools-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tuneplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  prerelease:
    name: Build Pre-Release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: 37.0.0
          cmdline-tools: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      # No release keystore on CI: signingConfig stays unset, so this APK is
      # unsigned and intended for sideload testing only.
      - name: Build pre-release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload pre-release APK
        uses: actions/upload-artifact@v4
        with:
          name: tuneplayer-prerelease
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Build Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 37
          build-tools-version: 37.0.0
          cmdline-tools-version: latest

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tuneplayer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
